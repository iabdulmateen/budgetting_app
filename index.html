<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgetting App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <body>
      <div class="container">
        <div class="form-section">
          <div class="card budget-card">
            <h2>Budget</h2>

            <input
              type="number"
              id="budget-input"
              placeholder="Enter Total Amount"
            />

            <button id="budget-btn">Set Budget</button>
          </div>

          <div class="card expense-card">
            <h2>Expenses</h2>

            <input
              type="text"
              id="expense-title"
              placeholder="Enter Title of Product"
            />

            <input
              type="number"
              id="expense-amount"
              placeholder="Enter Cost of Product"
            />

            <button id="expense-btn">Check Amount</button>
          </div>
        </div>
        <div class="summary">
          <div class="summary-box">
            <h3>Total-Budget</h3>
            <p id="total-budget">0</p>
          </div>
          <div class="summary-box">
            <h3>Expenses</h3>
            <p id="total-expense">0</p>
          </div>
          <div class="summary-box">
            <h3>Balance</h3>
            <p id="balance">0</p>
          </div>
        </div>
      </div>
    </body>

    <script src="./app.js"></script>
  </body>
</html>
